# Alerting rules: each one is a symptom a user would notice, with the metric
# that shows it.
groups:
  - name: learnify
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 5% of API requests are failing"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!="unmatched"}[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "p95 API latency above 1s"

      - alert: OutboxLagging
        expr: learnify_outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Events are not being published (oldest pending event older than 5 minutes)"

      - alert: DeadLetters
        expr: sum(rabbitmq_queue_messages{queue=~".*\\.dlq"}) > 0
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "Messages in a dead-letter queue need attention"

      - alert: CircuitOpen
        expr: max by (breaker) (learnify_circuit_breaker_open) == 1
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: "Circuit breaker {{ $labels.breaker }} is open (dependency failing)"
