# Local infrastructure for Learnify.
#
#   docker compose up -d          start everything
#   docker compose ps             see health
#   docker compose down           stop (data kept in named volumes)
#   docker compose down -v        stop and wipe all data
#
# Host ports are chosen to avoid clashing with a MongoDB already running on 27017.
#   mongo      27018   single-node replica set (needed for multi-document transactions)
#   redis      6379
#   rabbitmq   5672 (AMQP), 15672 (management UI: guest / guest)
#   qdrant     6333 (HTTP), 6334 (gRPC)   vector database for the RAG service
#
# The AI service is opt-in (it needs ai-service/.env with a Gemini key):
#   docker compose --profile ai up -d --build
#   ai-service 5001   reads course content from the API running on the host

services:
  mongo:
    image: mongo:7
    # The port is changed inside the container too, so the replica-set member
    # address (localhost:27018) is the same from the host and from the container.
    # Clients connect with ?directConnection=true.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # rs.status() throws until the set is initiated; the catch initiates it.
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27018 --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    profiles: ["ai"]
    build: ./ai-service
    env_file: ./ai-service/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      API_INTERNAL_URL: http://host.docker.internal:4000/api/v1/internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5001"
    depends_on:
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
  rabbitmq-data:
  qdrant-data:
