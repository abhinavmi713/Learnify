name: CI

# On every push and pull request:
#   backend / ai-service / frontend  unit and API tests, production frontend build
#   integration                      the same backend tests that need real RabbitMQ
#                                    and Elasticsearch, against service containers
#   alerts                           promtool checks and unit-tests the alert rules
#   images                           builds the API and AI service Docker images once every
#                                    test job has passed; on main they are pushed to GitHub
#                                    Container Registry
# The frontend build runs with CI=true (as Vercel and Netlify do), so lint
# warnings fail it here instead of at deploy time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs get a read-only token unless they ask for more (images does).
permissions:
  contents: read

# One run per branch at a time. A newer push to a pull request cancels the older
# run; on main, runs wait their turn, so an older build can't finish last and
# overwrite a newer :latest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          # The suite uses an in-memory MongoDB; these only need to exist.
          JWT_SECRET: test-secret-only-used-in-ci
          NODE_ENV: test

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -fs http://127.0.0.1:9200/_cluster/health"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Retry/DLQ topology against a real broker, and search relevance against a
      # real Elasticsearch (both are skipped in the plain backend job).
      - run: npx jest tests/rabbit.integration.test.js tests/search.test.js
        env:
          JWT_SECRET: test-secret-only-used-in-ci
          NODE_ENV: test
          RABBITMQ_TEST_URL: amqp://guest:guest@127.0.0.1:5672
          ES_TEST_URL: http://127.0.0.1:9200

  # Alert rules are code too: check their syntax and run their unit tests.
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts.test.yml

  images:
    runs-on: ubuntu-latest
    # Every test job must pass before an image is built or published.
    needs: [backend, integration, ai-service, frontend, alerts]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: server
          - name: ai-service
            context: ai-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/learnify-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      # Pull requests only prove the image builds; main also publishes it,
      # tagged with the commit sha (immutable) and latest.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      # Unit and HTTP tests with fake embeddings and a fake vector store: no
      # Gemini key, Qdrant or RabbitMQ needed.
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
          REACT_APP_BASE_URL: http://localhost:4000/api/v1
